services:
  fastapi-app:
    build: .
    container_name: my-fastapi-container
    ports:
      # 生产服务器经 main-gateway/nginx 反代，后端只对 localhost 暴露；容器间走 appnet 按名字互访
      - "127.0.0.1:8001:8001"
    networks:
      - appnet
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always

networks:
  appnet:
    external: true
